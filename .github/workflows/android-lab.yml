
name: Android native lab APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'crates/geom/**'
      - 'Cargo.toml'
      - '.github/workflows/android-lab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager --licenses || true

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bash android/build-native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-native-lab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
